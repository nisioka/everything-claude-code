[project]
name = "eval-harness"
version = "0.1.0"
description = "Waza-compatible eval harness for Claude Code skills"
requires-python = ">=3.11"
# uv.lock is committed to this repository so that local + CI installs resolve to
# the exact same versions. Run `uv sync --frozen` in CI and `uv sync` locally.
dependencies = [
    "anthropic>=0.100.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
pythonpath = ["."]
